<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115"><title>AI予想</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#0f1115;color:#e8eaf0;
     font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
     font-size:15px;line-height:1.5;padding-bottom:48px;}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.96);
       backdrop-filter:blur(6px);border-bottom:1px solid #262b36;padding:10px 12px;}
h1{font-size:17px;margin:0 0 6px;}
.nav{display:flex;flex-wrap:wrap;gap:6px;}
.nav a{min-width:34px;text-align:center;padding:5px 7px;border:1px solid #262b36;
       border-radius:8px;color:#e8eaf0;text-decoration:none;font-size:13px;background:#171a21;}
.venue{display:flex;gap:8px;margin-bottom:8px;}
.venue a{padding:5px 12px;border:1px solid #3a4152;border-radius:8px;color:#4da3ff;
         text-decoration:none;font-size:13px;background:#1f2634;font-weight:600;}
.wrap{padding:10px;}
details{background:#171a21;border:1px solid #262b36;border-radius:12px;margin:0 0 12px;overflow:hidden;}
summary{list-style:none;cursor:pointer;padding:11px 13px;font-weight:700;font-size:15px;}
summary::-webkit-details-marker{display:none;}
.meta{font-size:12px;color:#98a0b3;font-weight:400;margin-top:3px;}
.pace{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:999px;
      background:#1f2634;color:#4da3ff;font-size:12px;font-weight:600;}
.lap{display:inline-block;margin-top:5px;margin-left:6px;padding:2px 8px;border-radius:999px;
     background:#1c2a22;color:#6ddba0;font-size:12px;font-weight:600;}
.lap.off{background:#2a2530;color:#b9a7c9;}
.src{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:999px;
     background:#2a2f3b;color:#98a0b3;font-size:10.5px;font-weight:400;vertical-align:1px;}
.new{margin-left:6px;padding:2px 8px;border-radius:999px;background:#3a2f12;color:#ffd166;font-size:12px;}
.horse{border-top:1px solid #262b36;padding:9px 12px;display:flex;gap:9px;}
.horse.top{background:#191f2b;}
.horse.kesi{opacity:.55;}
.num{flex:0 0 34px;height:34px;border-radius:7px;display:flex;align-items:center;
     justify-content:center;font-weight:700;font-size:15px;border:1px solid #333;}
.body{flex:1;min-width:0;}
.l1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.mark{font-weight:700;color:#4da3ff;font-size:15px;min-width:16px;}
.hname{font-weight:700;font-size:15px;}
.badge{font-size:11px;padding:1px 6px;border-radius:5px;background:#3a2f12;color:#ffd166;
       border:1px solid #5a4a1d;font-weight:700;}
.l2{font-size:12px;color:#98a0b3;margin-top:1px;}
.kg{font-size:10.5px;padding:0 4px;border-radius:4px;background:#2a2f3b;color:#cfd6e6;}
.l3{margin-top:4px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:5px;}
.tag{padding:2px 7px;border-radius:6px;background:#20242e;border:1px solid #262b36;}
.lapt{background:#1c2a22;border-color:#2c4636;color:#9fd9bb;}
.lapt.hot{color:#6ddba0;border-color:#3d6b4f;}
.plus{color:#3ddc84;}.minus{color:#ff7b7b;}
.cmt{margin-top:5px;font-size:13px;color:#c9cfdd;line-height:1.6;}
footer{padding:14px 12px;color:#98a0b3;font-size:11.5px;text-align:center;}
</style></head><body><div class="wrap"><h1 style="padding:12px">AI予想　開催を選択</h1><div class="venue" style="padding:0 12px"><a href="sapporo.html">札幌</a><a href="niigata.html">新潟</a><a href="chukyo.html">中京</a></div></div></body></html>
